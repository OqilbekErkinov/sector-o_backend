{% extends "admin/base_site.html" %}

{% block content %}
<div style="max-width: 760px;">
  <p style="margin-bottom: 14px; opacity: .8; line-height: 1.6;">
    {{ intro_text }}
  </p>

  <form method="post" id="ai-add-form">
    {% csrf_token %}
    <textarea
      name="brief"
      rows="5"
      required
      placeholder="{{ placeholder }}"
      style="width:100%; padding:12px; border:1px solid rgba(136,136,136,.5); border-radius:8px; background:transparent; color:inherit; font:inherit; resize:vertical;"
    >{{ brief }}</textarea>

    <button
      type="submit"
      id="ai-add-btn"
      style="margin-top:12px; padding:10px 22px; border:0; border-radius:8px; cursor:pointer; font-weight:600; color:#fff; background:var(--color-primary-600, #00a6cc);"
    >
      ✨ Generatsiya qilish
    </button>
  </form>
</div>

<script>
  document.getElementById('ai-add-form').addEventListener('submit', function () {
    var btn = document.getElementById('ai-add-btn');
    btn.disabled = true;
    btn.style.opacity = '.6';
    btn.textContent = '⏳ AI ishlayapti — 30-60 soniya kuting...';
  });
</script>
{% endblock %}
