<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; font-family: 'Segoe UI', sans-serif; color: #e2e8f0; }
        .container { max-width: 600px; margin: 40px auto; background-color: #1e293b; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .header { background-color: #020617; padding: 30px 20px; text-align: center; border-bottom: 2px solid #3b82f6; }
        .logo { font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #ffffff; text-transform: uppercase; }
        .logo span { color: #3b82f6; }
        .content { padding: 40px 30px; text-align: center; }
        .title { font-size: 22px; font-weight: 600; margin-bottom: 10px; color: #f8fafc; }
        .greeting { font-size: 16px; color: #94a3b8; margin-bottom: 30px; }
        .code-box { background-color: #0f172a; border: 1px dashed #3b82f6; border-radius: 12px; padding: 20px; margin: 0 auto 30px; max-width: 300px; }
        .code { font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #3b82f6; margin: 0; }
        .info { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
        .warning { font-size: 13px; color: #ef4444; background-color: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 30px; }
        .footer { background-color: #0f172a; padding: 20px; text-align: center; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Sector<span>-O</span></div>
        </div>
        
        <div class="content">
            <!-- Sarlavha (Title) -->
            <div class="title">{{ title_text }}</div>
            
            <!-- Salomlashish (Greeting) -->
            <div class="greeting">{{ greeting_word }} {{ full_name }},</div>
            
            <!-- Asosiy ma'lumot (Info) -->
            <p class="info">{{ description_text }}</p>
            
            <!-- Tasdiqlash kodi -->
            <div class="code-box">
                <p class="code">{{ verification_code }}</p>
            </div>
            
            <!-- Yaroqlilik muddati (Validity info) -->
            <p class="info">{{ validity_text }}</p>
            
            <!-- Ogohlantirish (Warning) -->
            <div class="warning">
                <strong>{{ warning_bold_text }}</strong> {{ warning_text }}
            </div>
        </div>
        
        <div class="footer">
            &copy; 2026 Sector-O Fitness. {{ footer_rights_text }}<br>
            {{ footer_ignore_text }}
        </div>
    </div>
</body>
</html>
